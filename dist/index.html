<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BPN Gestion</title>
<meta name="theme-color" content="#14303A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Charte BPN : vert profond #14303A, laiton #B8964A, ivoire #F6F1E9, bleu océan #1878A0. Titres en Lora.
     Layout : barre d'onglets en bas sur téléphone, colonne latérale sur grand écran, fiches en panneau. */
  --bg: #F6F1E9;
  --surface: #FFFDF9;
  --surface-2: #FAF6EF;
  --text: #14303A;
  --muted: #5B6A70;
  --line: #E4DBCC;
  --brand: #14303A;
  --brand-text: #F6F1E9;
  --accent: #B8964A;
  --accent-soft: #F0E6D2;
  --primary: #14303A;
  --primary-text: #F6F1E9;
  --ocean: #1878A0;
  --ok: #2E7A4B;
  --ok-bg: #E3F1E6;
  --warn: #93600F;
  --warn-bg: #FAEBD0;
  --crit: #B1393A;
  --crit-bg: #FAE3E1;
  --info: #1878A0;
  --info-bg: #E2EFF5;
  --shadow: 0 1px 2px rgba(20, 48, 58, .06), 0 6px 18px rgba(20, 48, 58, .07);
  --font-display: 'Lora', Georgia, 'Times New Roman', serif;
  --font-body: 'Source Sans 3', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  --radius: 12px;
  --tabbar-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1C22; --surface: #14303A; --surface-2: #193945; --text: #F6F1E9; --muted: #A8B7BB; --line: #24495A;
    --brand: #0A1A20; --brand-text: #F6F1E9; --accent: #C6A55A; --accent-soft: #2C2A1E;
    --primary: #B8964A; --primary-text: #14303A; --ocean: #4FA9D2;
    --ok: #6CC18D; --ok-bg: #173323; --warn: #E2AF58; --warn-bg: #352811; --crit: #F08983; --crit-bg: #3A1C1B; --info: #5FB3DA; --info-bg: #123447;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1C22; --surface: #14303A; --surface-2: #193945; --text: #F6F1E9; --muted: #A8B7BB; --line: #24495A;
  --brand: #0A1A20; --brand-text: #F6F1E9; --accent: #C6A55A; --accent-soft: #2C2A1E;
  --primary: #B8964A; --primary-text: #14303A; --ocean: #4FA9D2;
  --ok: #6CC18D; --ok-bg: #173323; --warn: #E2AF58; --warn-bg: #352811; --crit: #F08983; --crit-bg: #3A1C1B; --info: #5FB3DA; --info-bg: #123447;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num, .tile-value, td.n, .money { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Barre du haut */
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; background: var(--brand); color: var(--brand-text);
  padding: calc(env(safe-area-inset-top) + 10px) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); }
.logo { display: flex; align-items: center; gap: 8px; color: var(--accent); text-decoration: none; }
.logo svg { width: 22px; height: 36px; flex: none; }
.wordmark { display: grid; line-height: 1; gap: 3px; padding-left: 10px; border-left: 1.5px solid var(--accent); }
.wordmark b { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: .08em; color: var(--brand-text); }
.wordmark small { font-size: 8.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--brand-text); opacity: .85; white-space: nowrap; }
.topbar-title { display: none; flex: 1; min-width: 0; font-size: 15px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 10px; border-left: 1px solid rgba(255, 255, 255, .2); }
.avatar { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(255, 255, 255, .25); background: transparent; color: var(--brand-text); border-radius: 999px; padding: 3px 10px 3px 3px; font-size: 14px; }
.avatar { margin-left: auto; }
.avatar .dot { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #14303A; display: grid; place-items: center; font-weight: 700; font-size: 13px; }

/* Navigation */
.layout { display: block; }
.tabbar { position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(6, 1fr); background: var(--surface); border-top: 1px solid var(--line);
  padding: 4px max(4px, env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left)); }
.tabbar.few { grid-template-columns: repeat(2, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; border: 0; background: transparent; color: var(--muted); font-size: 11px; font-weight: 600; border-radius: 10px; text-decoration: none; }
.tab[aria-current="page"] { color: var(--text); }
.tab[aria-current="page"] svg { color: var(--accent); }
.tab.secondary { display: none; }
main { padding: 16px max(16px, env(safe-area-inset-right)) calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); max-width: 1120px; }

@media (min-width: 960px) {
  .topbar-title { display: block; margin-left: 6px; }
  .layout { display: grid; grid-template-columns: 228px minmax(0, 1fr); }
  .tabbar { position: sticky; top: 62px; height: calc(100vh - 62px); display: flex; flex-direction: column; gap: 2px; padding: 16px 12px; border-top: 0; border-right: 1px solid var(--line); }
  .tabbar.few { grid-template-columns: none; }
  .tab { flex-direction: row; justify-content: flex-start; gap: 12px; min-height: 42px; padding: 0 12px; font-size: 15px; }
  .tab[aria-current="page"] { background: var(--accent-soft); }
  .tab.secondary { display: flex; }
  .tab.more { display: none; }
  main { padding: 28px 36px 48px; }
}

/* Titres et blocs */
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.h1 { font-family: var(--font-display); font-size: 26px; font-weight: 600; line-height: 1.15; }
.sub { margin: 4px 0 0; color: var(--muted); }
.h2 { font-family: var(--font-display); font-size: 19px; font-weight: 600; margin-bottom: 10px; }
.h3 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 22px 0 8px; }
.block { margin-top: 26px; }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-weight: 600; font-size: 15px; text-decoration: none; }
.btn svg.i { width: 18px; height: 18px; }
.btn.primary { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--crit); border-color: var(--crit); color: #fff; }
.btn.danger-text { color: var(--crit); }
.btn.wide { width: 100%; }
.btn.sm { min-height: 34px; padding: 0 10px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }

/* Bandeaux, pastilles */
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--info-bg); color: var(--info); font-size: 14px; margin-bottom: 14px; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.crit { background: var(--crit-bg); color: var(--crit); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pill.crit { background: var(--crit-bg); color: var(--crit); border-color: transparent; }
.pill.info { background: var(--info-bg); color: var(--info); border-color: transparent; }
.pill.brand { background: var(--accent-soft); color: var(--text); border-color: transparent; }

/* Tuiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
@media (min-width: 760px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow); }
.tile-label { font-size: 13px; color: var(--muted); font-weight: 600; }
.tile-value { font-family: var(--font-display); font-size: 27px; font-weight: 600; line-height: 1.2; }
.tile-value small { font-size: 16px; color: var(--muted); font-family: var(--font-body); }
.tile-foot { font-size: 13px; color: var(--muted); }
.tile.crit { border-color: color-mix(in srgb, var(--crit) 45%, var(--line)); }
.tile.crit .tile-value { color: var(--crit); }

/* Liste à traiter */
.todo { display: grid; gap: 8px; }
.todo-item { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 11px 12px 11px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.todo-item .stripe { align-self: stretch; background: var(--info); border-radius: 0 3px 3px 0; }
.todo-item.crit .stripe { background: var(--crit); }
.todo-item.warn .stripe { background: var(--warn); }
.todo-item b { display: block; font-weight: 600; }
.todo-item span.meta { display: block; font-size: 14px; color: var(--muted); }
.todo-item svg.i { color: var(--muted); width: 18px; height: 18px; }

/* Entonnoir */
.funnel { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.f-row { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) 2.2em; gap: 10px; align-items: center; font-size: 14px; border: 0; background: transparent; padding: 0; text-align: left; }
.f-bar { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.f-bar span { display: block; height: 100%; background: var(--accent); border-radius: 6px; min-width: 4px; }
.f-row.won .f-bar span { background: var(--ocean); }
.f-row .n { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Contrôle segmenté */
.seg { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-bottom: 14px; overflow-x: auto; }
.seg button { flex: 1; border: 0; background: transparent; padding: 7px 10px; border-radius: 8px; font-weight: 600; color: var(--muted); white-space: nowrap; font-size: 14.5px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

/* Pipeline */
.board { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 0 16px 10px; align-items: flex-start; }
.col { flex: 0 0 min(82vw, 290px); scroll-snap-align: start; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; }
.col > header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; padding: 2px 4px 10px; }
.col .count { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: 12.5px; color: var(--muted); }
.col-body { display: grid; gap: 8px; min-height: 40px; }
.col.drop-hover { outline: 2px dashed var(--accent); outline-offset: -2px; }
.deal { display: grid; gap: 4px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); }
.deal-name { font-weight: 600; }
.deal-meta { font-size: 13.5px; color: var(--muted); }
.deal .pill { justify-self: start; }
.empty-col { font-size: 13.5px; color: var(--muted); margin: 4px; }
@media (min-width: 960px) { .board { margin: 0; padding: 0 0 10px; } }

/* Listes */
.list { display: grid; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
.item-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.item-main b { font-weight: 600; overflow-wrap: anywhere; }
.item-main span { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.item-side { display: grid; justify-items: end; gap: 4px; text-align: right; }
.item-side .money { font-weight: 700; }
.search { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; background: var(--surface); margin-bottom: 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 14px; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

/* Logements */
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.lcard { display: grid; gap: 8px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
.lcard h3 { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
.lcard .meta { font-size: 14px; color: var(--muted); }
.meter { height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--ok); }
.meter.over span { background: var(--warn); }
.meter-label { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--muted); }

/* Planning */
.weeknav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.weeknav .label { flex: 1; text-align: center; font-weight: 700; }
.day { margin-bottom: 14px; }
.day > h3 { font-size: 14px; font-weight: 700; color: var(--muted); margin: 0 0 6px; text-transform: capitalize; }
.day.is-today > h3 { color: var(--text); }
.day.is-today > h3::after { content: " · aujourd'hui"; color: var(--accent); text-transform: none; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 0; margin-bottom: 6px; }
.mrow-main { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); column-gap: 8px; text-align: left; background: transparent; border: 0; padding: 4px 0 4px 10px; }
.mtime { grid-row: span 2; font-weight: 700; font-variant-numeric: tabular-nums; padding-top: 1px; }
.mtitle { font-weight: 600; overflow-wrap: anywhere; }
.mmeta { font-size: 13.5px; color: var(--muted); }
.mrow-side { display: grid; justify-items: end; gap: 6px; }
.mrow-side select { max-width: 9.5em; min-height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 6px; font-size: 14px; }
.mrow-side select.unassigned { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); font-weight: 600; }

/* Formulaires */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fld { display: grid; gap: 4px; min-width: 0; }
.fld > span { font-size: 13px; font-weight: 600; color: var(--muted); }
.fld.full, .form-grid > .full { grid-column: 1 / -1; }
.fld input, .fld select, .fld textarea { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 8px 10px; font-size: 16px; }
.fld textarea { min-height: 84px; resize: vertical; }
.chk { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.chk input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--ok); flex: none; }
.hint { font-size: 13.5px; color: var(--muted); margin: 0; }
@media (max-width: 420px) { .form-grid { grid-template-columns: 1fr; } }

/* Panneau (fiche) */
#sheet-root { position: fixed; inset: 0; z-index: 50; display: none; }
#sheet-root.open { display: block; }
.scrim { position: absolute; inset: 0; background: rgba(6, 18, 14, .5); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; display: flex; flex-direction: column; background: var(--surface); border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(0, 0, 0, .2); padding-bottom: env(safe-area-inset-bottom); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 6px 18px; border-bottom: 1px solid var(--line); }
.sheet-head .kicker { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.sheet-body { overflow: auto; padding: 14px 18px 28px; overscroll-behavior: contain; }
.sheet-title h2 { font-family: var(--font-display); font-size: 23px; font-weight: 600; line-height: 1.2; }
.sheet-title p { margin: 6px 0 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 14.5px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 4px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 0; font-size: 15px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; padding-left: 14px; text-align: right; font-variant-numeric: tabular-nums; }
.kv .total { font-weight: 700; border-top: 1px solid var(--line); padding-top: 6px; }
.box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--crit-bg); color: var(--crit); border-radius: 10px; padding: 8px 10px; }
.confirm span { flex: 1; font-weight: 600; font-size: 14.5px; }
.danger-zone { margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--line); }
.timeline { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 10px; }
.timeline li { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; }
.tl-type { font-weight: 700; font-size: 14px; margin-right: 6px; }
.tl-date { font-size: 13px; color: var(--muted); }
.timeline p { margin: 2px 0 0; }
.checklist { display: grid; gap: 2px; }
.checklist .chk { border-bottom: 1px solid var(--line); padding: 9px 0; }
.edit-list { display: grid; gap: 6px; }
.edit-list li { display: flex; align-items: center; gap: 8px; }
.edit-list li span { flex: 1; }
ul.edit-list { list-style: none; padding: 0; margin: 0; }
.photos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.photo-in { min-width: 0; display: grid; gap: 6px; justify-items: start; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 10px; }
.photo-in input { font-size: 14px; max-width: 100%; }
.thumbs { display: flex; gap: 4px; flex-wrap: wrap; }
.thumbs img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; }
.table-wrap { overflow-x: auto; }
table.inv { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.inv th { text-align: left; font-size: 12.5px; color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--line); padding: 6px 4px; }
table.inv td { border-bottom: 1px solid var(--line); padding: 8px 4px; vertical-align: top; }
table.inv .n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.inv-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.inv-head .r { text-align: right; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 19px; font-variant-numeric: tabular-nums; }

<script>
/* Mini générateur PDF sans dépendance (Helvetica, encodage WinAnsi : accents, €, guillemets).
   API en points, origine en haut à gauche (A4 : 595 × 842). */
(function (root) {
  const PW = 595.28, PH = 841.89;
  const HW = [278, 278, 355, 556, 556, 889, 667, 191, 333, 333, 389, 584, 278, 333, 278, 278, 556, 556, 556, 556, 556, 556, 556, 556, 556, 556, 278, 278, 584, 584, 584, 556, 1015, 667, 667, 722, 722, 667, 611, 778, 722, 278, 500, 667, 556, 833, 722, 778, 667, 778, 722, 667, 611, 722, 667, 944, 667, 667, 611, 278, 278, 278, 469, 556, 333, 556, 556, 500, 556, 556, 278, 556, 556, 222, 222, 500, 222, 833, 556, 556, 556, 556, 333, 500, 278, 556, 500, 722, 500, 500, 500, 334, 260, 334, 584];
  const WIN = { 0x20AC: 0x80, 0x201A: 0x82, 0x0192: 0x83, 0x201E: 0x84, 0x2026: 0x85, 0x2020: 0x86, 0x2021: 0x87, 0x02C6: 0x88, 0x2030: 0x89, 0x0160: 0x8A, 0x2039: 0x8B, 0x0152: 0x8C, 0x017D: 0x8E, 0x2018: 0x91, 0x2019: 0x92, 0x201C: 0x93, 0x201D: 0x94, 0x2022: 0x95, 0x2013: 0x96, 0x2014: 0x97, 0x02DC: 0x98, 0x2122: 0x99, 0x0161: 0x9A, 0x203A: 0x9B, 0x0153: 0x9C, 0x017E: 0x9E, 0x0178: 0x9F };
  const SPECIAL_W = { 0x20AC: 556, 0x2019: 222, 0x2018: 222, 0x201C: 333, 0x201D: 333, 0x2013: 556, 0x2014: 1000, 0x2026: 1000, 0xA0: 278, 0x202F: 278, 0x2022: 350, 0xAB: 556, 0xBB: 556, 0xB0: 400, 0x0153: 944, 0x0152: 1000, 0xE6: 889, 0xDF: 611 };
  const SPACES = new Set([0x202F, 0x2009, 0x2007, 0x2002, 0x2003]);

  function charW(ch, bold) {
    const c = ch.codePointAt(0);
    let w;
    if (c >= 32 && c <= 126) w = HW[c - 32];
    else if (SPECIAL_W[c]) w = SPECIAL_W[c];
    else { const base = ch.normalize('NFD')[0]; const bc = base.codePointAt(0); w = (bc >= 32 && bc <= 126) ? HW[bc - 32] : 556; }
    if (bold && !(c >= 48 && c <= 57)) w *= 1.08;
    return w;
  }
  function width(s, size, bold) { let w = 0; for (const ch of String(s)) w += charW(ch, bold); return w * size / 1000; }
  function encode(s) {
    let out = '';
    for (const ch of String(s)) {
      let c = ch.codePointAt(0);
      if (SPACES.has(c)) c = 0x20;
      if (c === 0x0A || c === 0x0D || c === 0x09) c = 0x20;
      let b;

  }
  const n = v => (Math.round(v * 100) / 100).toString();
  function rgb(hex) { const h = hex.replace('#', ''); return [0, 2, 4].map(i => n(parseInt(h.slice(i, i + 2), 16) / 255)).join(' '); }

  class Doc {
    constructor(title) { this.title = title || 'Document'; this.pages = []; this.addPage(); }
    addPage() { this.ops = []; this.pages.push(this.ops); return this; }
    get width() { return PW; }
    get height() { return PH; }
    text(x, y, s, o = {}) {
      const size = o.size || 10, bold = !!o.bold, sp = o.spacing || 0;
      let xx = x;
      if (o.align === 'right' || o.align === 'center') {
        const w = width(s, size, bold) + sp * Math.max(0, [...String(s)].length - 1);
        xx = o.align === 'right' ? x - w : x - w / 2;
      }
      this.ops.push(`BT /${bold ? 'F2' : 'F1'} ${size} Tf ${n(sp)} Tc ${rgb(o.color || '#14303A')} rg ${n(xx)} ${n(PH - y)} Td (${encode(s)}) Tj ET`);
      return this;
    }
    rect(x, y, w, h, o = {}) {
      const parts = [];
      if (o.fill) parts.push(rgb(o.fill) + ' rg');
      if (o.stroke) parts.push(rgb(o.stroke) + ' RG ' + n(o.lw || 1) + ' w');
      parts.push(`${n(x)} ${n(PH - y - h)} ${n(w)} ${n(h)} re ${o.fill && o.stroke ? 'B' : o.fill ? 'f' : 'S'}`);
      this.ops.push(parts.join(' '));
      return this;
    }
    line(x1, y1, x2, y2, o = {}) { this.ops.push(`${rgb(o.color || '#E4DBCC')} RG ${n(o.lw || 0.8)} w ${n(x1)} ${n(PH - y1)} m ${n(x2)} ${n(PH - y2)} l S`); return this; }
    poly(pts, o = {}) {
      const d = pts.map((p, i) => `${n(p[0])} ${n(PH - p[1])} ${i ? 'l' : 'm'}`).join(' ');
      this.ops.push(`${rgb(o.color || '#B8964A')} RG ${n(o.lw || 1)} w 0 j ${d} ${o.close ? 'h ' : ''}S`);
      return this;
    }
    wrap(s, maxW, size, bold) {
      const lines = [];
      String(s || '').split(/\n/).forEach(par => {
        let cur = '';
        par.split(/\s+/).filter(Boolean).forEach(word => {
          const t = cur ? cur + ' ' + word : word;
          if (width(t, size, bold) <= maxW || !cur) cur = t; else { lines.push(cur); cur = word; }
        });
        lines.push(cur);
      });
      return lines;
    }
    paragraph(x, y, s, maxW, o = {}) {
      const size = o.size || 10, lh = o.lineHeight || size * 1.4;
      const lines = this.wrap(s, maxW, size, o.bold);
      lines.forEach((l, i) => this.text(x, y + i * lh, l, o));
      return y + lines.length * lh;
    }
    /* Logo BPN : clé dont la tête est une maison */
    logo(x, y, h, color) {
      const k = h / 40, P = (a, b) => [x + a * k, y + b * k];
      this.poly([P(3, 11.5), P(12, 3), P(21, 11.5), P(21, 21), P(3, 21)], { color, lw: 2.8 * k, close: true });
      this.rect(x + 10.6 * k, y + 21 * k, 2.8 * k, 17.5 * k, { fill: color });
      this.rect(x + 13.4 * k, y + 29.2 * k, 5.2 * k, 2.6 * k, { fill: color });
      this.rect(x + 13.4 * k, y + 34.4 * k, 5.2 * k, 2.6 * k, { fill: color });
      this.rect(x + 16 * k, y + 29.2 * k, 2.6 * k, 7.8 * k, { fill: color });
      return this;
    }
    output() {
      const objs = [null, null, null, null];
      const kids = [];
      this.pages.forEach(ops => {
        const content = ops.join('\n');
        objs.push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
        const cn = objs.length;
        objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${cn} 0 R >>`);
        kids.push(objs.length);
      });
      objs.push(`<< /Title (${encode(this.title)}) /Producer (BPN Gestion) >>`);
      const info = objs.length;
      objs[0] = '<< /Type /Catalog /Pages 2 0 R >>';
      objs[1] = `<< /Type /Pages /Kids [${kids.map(k => k + ' 0 R').join(' ')}] /Count ${kids.length} >>`;
      objs[2] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
      objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
      let out = '%PDF-1.4\n';
      const offs = [];
      objs.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
      const xref = out.length;
      out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
      out += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
      const bytes = new Uint8Array(out.length);
      for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xFF;
      return bytes;
    }
  }
  const api = { PDFDoc: Doc, pdfTextWidth: width };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else Object.assign(root, api);
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Documents PDF de BPN : facture et compte rendu mensuel. Fonctions pures : données en entrée, octets PDF en sortie. */
(function (root) {
  const PDFDoc = root.PDFDoc || (typeof require !== 'undefined' ? require('./pdf.js').PDFDoc : null);
  const C = { vert: '#14303A', laiton: '#B8964A', ivoire: '#F6F1E9', ocean: '#1878A0', texte: '#14303A', gris: '#5B6A70', ligne: '#E4DBCC', fond: '#FAF6EF', ok: '#2E7A4B', crit: '#B1393A' };
  const eur = v => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(v || 0);
  const d8 = iso => { if (!iso) return '—'; const [y, m, d] = iso.split('-').map(Number); return new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(y, m - 1, d)); };
  const dShort = iso => { const [y, m, d] = iso.split('-').map(Number); return new Intl.DateTimeFormat('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }).format(new Date(y, m - 1, d)); };
  const mois = ym => new Intl.DateTimeFormat('fr-FR', { month: 'long', year: 'numeric' }).format(new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1, 1));

  function header(doc, kicker, title) {
    const W = doc.width;
    doc.rect(0, 0, W, 104, { fill: C.vert });
    doc.logo(46, 26, 54, C.laiton);
    doc.rect(84, 30, 1.2, 46, { fill: C.laiton });
    doc.text(96, 58, 'BPN', { size: 28, bold: true, color: C.ivoire, spacing: 2 });
    doc.text(97, 74, 'VOTRE BIEN, NOTRE ENGAGEMENT', { size: 7, color: C.ivoire, spacing: 1.4 });
    doc.text(W - 46, 50, kicker, { size: 9, bold: true, color: C.laiton, align: 'right', spacing: 1.5 });
    doc.text(W - 46, 72, title, { size: 16, bold: true, color: C.ivoire, align: 'right' });
  }
  function footer(doc, txt) {
    const W = doc.width, H = doc.height;
    doc.line(46, H - 58, W - 46, H - 58, { color: C.ligne });
    doc.paragraph(46, H - 42, txt, W - 92, { size: 7.5, color: C.gris, lineHeight: 10 });
  }

  function invoicePDF(p) {
    const { f, client, logement, statut } = p;
    const avoir = f.type === 'avoir';
    const doc = new PDFDoc((avoir ? 'Avoir ' : 'Facture ') + f.numero);
    const W = doc.width, L = 46, R = W - 46;
    header(doc, avoir ? 'AVOIR' : 'FACTURE', f.numero);
    let y = 140;
    doc.text(L, y, 'BPN SAS', { size: 10, bold: true });
    doc.text(L, y + 14, 'Conciergerie de locations saisonnières', { size: 9, color: C.gris });
    doc.text(L, y + 27, 'Côte sud du Morbihan', { size: 9, color: C.gris });
    doc.rect(R - 220, y - 14, 220, 76, { fill: C.fond, stroke: C.ligne, lw: 0.6 });
    doc.text(R - 206, y + 2, 'Facturé à', { size: 8, bold: true, color: C.gris });
    doc.text(R - 206, y + 18, client || '—', { size: 11, bold: true });
    doc.paragraph(R - 206, y + 33, (logement ? logement.nom + ' · ' + (logement.adresse ? logement.adresse + ', ' : '') + logement.commune : ''), 192, { size: 8.5, color: C.gris, lineHeight: 11 });
    y = 236;
    const meta = [['Date d’émission', d8(f.date)], avoir ? ['Annule la facture', f.ref || '—'] : ['Échéance', d8(f.echeance)], ['Période', mois(f.mois)]];
    meta.forEach((m, i) => { const x = L + i * 168; doc.text(x, y, m[0], { size: 8, bold: true, color: C.gris }); doc.text(x, y + 15, m[1], { size: 10.5 }); });
    y = 284;
    const cQ = R - 190, cPU = R - 100;
    doc.rect(L, y, R - L, 24, { fill: C.vert });
    doc.text(L + 10, y + 16, 'Désignation', { size: 8.5, bold: true, color: C.ivoire });
    doc.text(cQ, y + 16, 'Qté', { size: 8.5, bold: true, color: C.ivoire, align: 'right' });
    doc.text(cPU, y + 16, 'PU HT', { size: 8.5, bold: true, color: C.ivoire, align: 'right' });
    doc.text(R - 10, y + 16, 'Total HT', { size: 8.5, bold: true, color: C.ivoire, align: 'right' });
    y += 24;
    f.lignes.forEach((li, i) => {
      const lines = doc.wrap(li.libelle, cQ - L - 50, 9.5);
      const h = Math.max(26, 12 + lines.length * 13);
      if (i % 2) doc.rect(L, y, R - L, h, { fill: C.fond });
      lines.forEach((t, k) => doc.text(L + 10, y + 17 + k * 13, t, { size: 9.5 }));
      doc.text(cQ, y + 17, String(li.qte), { size: 9.5, align: 'right' });
      doc.text(cPU, y + 17, eur(li.pu), { size: 9.5, align: 'right' });
      doc.text(R - 10, y + 17, eur(li.qte * li.pu), { size: 9.5, align: 'right' });
      y += h;
    });
    doc.line(L, y, R, y, { color: C.ligne });

function toBill(ym) { const end = ym + '-31'; return actifs().filter(l => (l.contrat.debut || '') <= end && !list('factures').some(f => f.logementId === l.id && f.mois === ym && f.type !== 'avoir' && f.statut !== 'annulee')); }

function rapportStats(lid, ym) {

function rapportPDFOf(lid, ym) { const l = S.logements[lid]; return rapportPDF({ logement: { nom: l.nom, type: TYPES[l.type], commune: l.commune }, proprietaire: fullName(S.contacts[l.proprietaireId]), ym, stats: rapportStats(lid, ym), mot: (S.rapports[lid + '_' + ym] || {}).mot || '' }); }

  });

  alertes().forEach(a => todo.push(a));

    ${tile('Factures en retard', retard.length, retard.length ? eur(retard.reduce((s, f) => s + f.totalTTC, 0)) + ' TTC' : 'Tout est à jour', 'factures', retard.length ? 'crit' : '')}

    <div class="todo">${todo.length ? todo.map(x => `<button class="todo-item ${x.cls}" data-act="${x.act}" data-id="${esc(x.id)}"><span class="stripe"></span><span><b>${esc(x.titre)}</b><span class="meta">${esc(x.meta)}</span></span>${ico('right')}</button>`).join('') : emptyBox('Rien à traiter pour l’instant.')}</div>
  </section>

function chartRotations(m) {
  const ls = actifs().sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
  if (!ls.length) return emptyBox('Aucun logement sous contrat.');
  const rows = ls.map(l => { const f = formuleOf(l); const done = rotations(l.id, m, true).length; const all = rotations(l.id, m).length; return { l, q: f.quota, done, plan: all - done }; });
  const scale = Math.max(...rows.map(r => Math.max(r.q, r.done + r.plan)), 1) * 1.1;
  return `<div class="chart"><div class="legend"><span><i></i>Faites</span><span><i style="background:repeating-linear-gradient(45deg,var(--ocean) 0 3px,transparent 3px 6px)"></i>Prévues</span><span><i class="est"></i>Au-delà du forfait</span><span><i class="quota"></i>Forfait</span></div>
  ${rows.map(r => `<button class="hbar" data-act="openLogement" data-id="${r.l.id}"><span>${esc(r.l.nom)}</span><span class="track"><span class="fill${r.done > r.q ? ' over' : ''}" style="width:${r.done / scale * 100}%"></span><span class="ghost" style="left:${r.done / scale * 100}%;width:${r.plan / scale * 100}%"></span><span class="quota" style="left:${r.q / scale * 100}%"></span></span><span class="v">${r.done}/${r.q}</span></button>`).join('')}</div>`;
}
function chartCA(m) {
  const months = [...Array(6)].map((_, i) => addMonths(m, i - 5));
  const vals = months.map(ym => list('factures').filter(f => f.mois === ym && f.statut !== 'annulee').reduce((s, f) => s + f.totalTTC, 0));
  const est = toBill(m).reduce((s, l) => { const ht = invoiceLines(l, m).reduce((a, x) => a + x.qte * x.pu, 0); return s + ht * (1 + S.settings.tva / 100); }, 0);
  const first = vals.findIndex(v => v > 0);
  if (first < 0 && !est) return emptyBox('Aucune facture pour l’instant.');
  const ms = months.slice(Math.max(0, Math.min(first < 0 ? 5 : first, 3)));
  const vs = ms.map(ym => vals[months.indexOf(ym)]);
  const top = Math.max(...vs.map((v, i) => v + (ms[i] === m ? est : 0)), 1);
  return `<div class="chart"><div class="legend"><span><i></i>Facturé TTC</span>${est ? `<span><i class="est"></i>Reste à facturer ce mois (estimation)</span>` : ''}</div>
  <div class="vbars">${ms.map((ym, i) => { const v = vs[i]; const e = ym === m ? est : 0; return `<div class="vbar"><span class="val">${v || e ? eur0(v + e) : '—'}</span>${e ? `<span class="colv est" style="height:${e / top * 120}px"></span>` : ''}<span class="colv" style="height:${v / top * 120}px;${e ? 'border-radius:0' : ''}"></span><span class="lbl">${esc(fmtMonthShort(ym))}</span></div>`; }).join('')}</div></div>`;
}

function dataContext() {
  const t = TODAY(), m = t.slice(0, 7); const L = [];
  L.push('Date du jour : ' + t + '. Utilisateur : ' + profileName() + ' (' + profileRole() + ').');
  L.push('Formules : ' + S.settings.formules.map(f => f.nom + ' ' + f.prix + ' € HT/mois, ' + f.quota + ' rotations incluses').join(' ; ') + '. Rotation en plus : ' + S.settings.tarifSup.petit + ' € HT (studio, T2), ' + S.settings.tarifSup.grand + ' € HT (T3, maison), facturée le mois suivant.');
  L.push('\nLOGEMENTS SOUS CONTRAT');
  actifs().forEach(l => { const f = formuleOf(l); const d = rotations(l.id, m, true).length; const a = rotations(l.id, m).length; const inc = list('incidents').filter(i => i.logementId === l.id && i.statut === 'ouvert').map(i => i.texte); L.push(`- ${l.nom} (${TYPES[l.type]}, ${l.commune}), propriétaire ${fullName(S.contacts[l.proprietaireId])}, formule ${f.nom}, rotations ce mois : ${d} faites sur ${f.quota} incluses, ${a - d} prévues${inc.length ? ', incidents ouverts : ' + inc.join(' / ') : ''}.`); });
  L.push('\nPROSPECTS EN COURS');
  list('contacts').filter(isOpenProspect).forEach(c => L.push(`- ${fullName(c)}, étape ${etapeNom(c.etape)}, relance ${c.relance || 'non fixée'}, ${c.commune || ''}, origine ${c.origine || '?'}${c.bien ? ', bien : ' + c.bien : ''}, dernier échange : ${((c.historique || []).slice(-1)[0] || {}).texte || 'aucun'}.`));
  L.push('\nMISSIONS DES 14 PROCHAINS JOURS');
  list('missions').filter(x => x.date >= t && x.date <= addDays(t, 14)).sort((a, b) => (a.date + a.heure).localeCompare(b.date + b.heure)).forEach(x => L.push(`- ${x.date} ${x.heure} ${S.logements[x.logementId]?.nom || '?'}, ${x.type === 'service' ? x.libelle : 'rotation'}, concierge : ${fullName(S.concierges[x.conciergeId]) === '—' ? 'aucun' : fullName(S.concierges[x.conciergeId])}, statut ${STATUTS_M[x.statut]}.`));
  L.push('\nFACTURES (6 derniers mois)');
  list('factures').filter(f => f.mois >= addMonths(m, -6)).sort((a, b) => a.numero.localeCompare(b.numero)).forEach(f => L.push(`- ${f.numero} ${fullName(S.contacts[f.proprietaireId])}, ${f.mois}, ${r2(f.totalTTC)} € TTC, ${FACT_LABEL[factStatut(f)][0]}.`));
  const tb = toBill(m); if (tb.length) { L.push('\nRESTE À FACTURER CE MOIS (estimation)'); tb.forEach(l => { const ht = invoiceLines(l, m).reduce((s, x) => s + x.qte * x.pu, 0); L.push(`- ${l.nom} : ${r2(ht)} € HT (${invoiceLines(l, m).map(x => x.libelle + ' ' + x.qte + ' × ' + x.pu + ' €').join(' ; ')}).`); }); }
  L.push('\nCONCIERGES'); list('concierges').forEach(c => L.push(`- ${fullName(c)}, zone ${(c.zone || []).join(', ')}, URSSAF valable jusqu’au ${c.docs?.urssaf || '?'}, RC pro jusqu’au ${c.docs?.rcpro || '?'}.`));
  const sb = stocksBas(); if (sb.length) L.push('\nSTOCKS BAS : ' + sb.map(s => s.nom + ' ' + s.quantite + ' ' + s.unite + ' (seuil ' + s.seuil + ')').join(' ; '));
  L.push('\nALERTES : ' + (alertes().map(a => a.titre + ' (' + a.meta + ')').join(' ; ') || 'aucune'));
  L.push('\nASTREINTE DE LA SEMAINE : ' + PROFILES[astreinteOf(mondayOf(t))].nom + '.');
  return L.join('\n');
}

/* ---------- Vue : Mes missions (concierge) ---------- */
function vMissions() {
  const c = myConcierge();
  if (!c) return emptyBox('Choisissez votre profil de concierge dans le menu Profil.');
  const t = TODAY();
  const mine = list('missions').filter(m => m.conciergeId === c.id);
  const byTime = (a, b) => (a.date + a.heure).localeCompare(b.date + b.heure);
  const todays = mine.filter(m => m.date === t).sort(byTime);
  const next = mine.filter(m => m.date > t && m.date <= addDays(t, 14)).sort(byTime);
  const late = mine.filter(m => m.date < t && m.statut !== 'terminee').sort(byTime);
  const done = mine.filter(m => m.date < t && m.statut === 'terminee').sort((a, b) => byTime(b, a)).slice(0, 4);
  const u = dateState(c.docs?.urssaf, 30);
  const card = m => { const l = S.logements[m.logementId]; return `<button class="big-card" data-act="openMission" data-id="${m.id}"><span class="row"><span class="when">${esc(m.heure || '')} · ${esc(l?.nom || '')}</span><span class="spacer"></span>${statutPill(m)}</span><span class="muted">${esc(fmtDate(m.date))} · ${esc(m.type === 'service' ? (m.libelle || 'Service') : 'Rotation complète')} · ${esc(l?.adresse || '')}, ${esc(l?.commune || '')}</span></button>`; };
  return `${modeBanner()}${head('Bonjour ' + esc(c.prenom), esc(fmtLong(t)))}
  ${u.cls !== 'ok' ? `<div class="banner ${u.cls === 'crit' ? 'crit' : 'warn'}">Votre attestation URSSAF ${u.cls === 'crit' ? 'a expiré' : 'expire bientôt'} : envoyez la nouvelle à Bedirhan.</div>` : ''}

  <h2 class="h3">Les 14 prochains jours</h2><div class="stack">${next.length ? next.map(card).join('') : '<p class="muted">Rien de prévu.</p>'}</div>
  ${done.length ? `<h2 class="h3">Dernières missions faites</h2><div class="stack">${done.map(card).join('')}</div>` : ''}`;
}

  root.classList.add('open'); document.body.classList.add('noscroll');

}

/* ---------- Rédaction d'e-mails (modèles + IA) ---------- */
function composeCtx(s) {
  const sign = '\n\nBien cordialement,\n' + (isAssocie() ? profileName() : 'L’équipe') + '\nBPN – Votre bien, notre engagement';
  if (s.mode === 'relance') {
    const c = S.contacts[s.id]; if (!c) return null;
    return { to: c.email, toName: fullName(c), contactId: c.id, subject: 'BPN – suite à notre échange', body: `Bonjour ${c.prenom || ''},\n\nJe reviens vers vous au sujet de ${c.bien ? c.bien.charAt(0).toLowerCase() + c.bien.slice(1) : 'votre logement'}${c.commune ? ' à ' + c.commune : ''}. Seriez-vous disponible cette semaine pour en parler quelques minutes ?` + sign,
      prompt: () => `Rédige un e-mail de relance court (120 mots maximum), chaleureux et professionnel, en vouvoyant. Expéditeur : ${profileName()}, de BPN, conciergerie de locations saisonnières sur la côte sud du Morbihan, qui gère les logements de A à Z contre un abonnement mensuel fixe (pas de commission sur les loyers). Destinataire : ${fullName(c)}, ${c.commune || ''}. Étape commerciale : ${etapeNom(c.etape)}. Bien : ${c.bien || 'non précisé'}. Origine : ${c.origine || '?'}${c.prescripteur ? ', recommandé par ' + c.prescripteur : ''}. Notes : ${c.notes || 'aucune'}. Historique : ${(c.historique || []).slice(-4).map(h => h.date + ' ' + (HIST_TYPES[h.type] || h.type) + ' : ' + h.texte).join(' | ') || 'aucun'}. Objectif : faire avancer d'une étape (premier contact → proposer un appel ou un rendez-vous ; rendez-vous → caler la visite ; audit → finaliser l'audit ; proposition → recueillir son avis sur la proposition). Ne cite aucun prix ni chiffre absent de ces données. Termine par « Bien cordialement, ${profileName()} » puis « BPN – Votre bien, notre engagement ». Réponds uniquement en JSON : {"objet": "...", "message": "..."} (message en texte brut avec retours à la ligne).` };
  }
  if (s.mode === 'rapport') {
    const l = S.logements[s.id]; if (!l) return null; const o = S.contacts[l.proprietaireId]; const st = rapportStats(l.id, s.ym); const mot = (S.rapports[l.id + '_' + s.ym] || {}).mot || '';
    return { to: o?.email, toName: fullName(o), attach: { name: 'compte-rendu-' + slug(l.nom) + '-' + s.ym + '.pdf', make: () => rapportPDFOf(l.id, s.ym) }, subject: 'Compte rendu ' + fmtMonth(s.ym) + ' – ' + l.nom,
      body: `Bonjour ${o?.prenom || ''},\n\nVoici le compte rendu de ${fmtMonth(s.ym)} pour ${l.nom}.\n\n${mot ? mot + '\n\n' : ''}En bref : ${plural(st.faites, 'rotation faite', 'rotations faites')} pour ${st.quota} incluses dans votre formule${st.enPlus ? ', dont ' + st.enPlus + ' en plus, facturée' + (st.enPlus > 1 ? 's' : '') + ' avec l’abonnement du mois prochain' : ''}${st.incidents.length ? ', et ' + plural(st.incidents.length, 'intervention') + ' sur un incident' : ''}.\n\nLe détail est dans le PDF joint.` + sign,
      prompt: () => `Rédige l'e-mail d'envoi du compte rendu mensuel à un propriétaire (100 mots maximum, vouvoiement, ton chaleureux). Logement : ${l.nom} (${l.commune}). Mois : ${fmtMonth(s.ym)}. Propriétaire : ${fullName(o)}. Rotations faites : ${st.faites}, incluses : ${st.quota}, en plus : ${st.enPlus} (facturées le mois suivant). Incidents : ${st.incidents.map(i => i.texte + (i.statut === 'clos' ? ' (résolu)' : ' (en cours)')).join(' ; ') || 'aucun'}. Mot du mois déjà rédigé : ${mot || 'aucun'}. Indique que le PDF est joint. Ne cite aucun chiffre absent de ces données. Signe « Bien cordialement, ${profileName()} » puis « BPN – Votre bien, notre engagement ». Réponds uniquement en JSON : {"objet": "...", "message": "..."}.` };
  }
  if (s.mode === 'facture') {
    const f = S.factures[s.id]; if (!f) return null; const o = S.contacts[f.proprietaireId]; const l = S.logements[f.logementId];
    return { to: o?.email, toName: fullName(o), attach: { name: 'facture-' + f.numero + '.pdf', make: () => facturePDF(f) }, subject: 'Facture ' + f.numero + ' – BPN',
      body: `Bonjour ${o?.prenom || ''},\n\nVeuillez trouver ci-joint la facture ${f.numero} pour ${l?.nom || 'votre logement'} (${fmtMonth(f.mois)}), d’un montant de ${eur(f.totalTTC)} TTC, à régler avant le ${fmtDateFull(f.echeance)}.\n\nN’hésitez pas à me contacter pour toute question.` + sign,
      prompt: () => `Rédige un e-mail court (80 mots maximum, vouvoiement) pour envoyer une facture à un propriétaire. Facture ${f.numero}, ${l?.nom || ''}, période ${fmtMonth(f.mois)}, ${eur(f.totalTTC)} TTC, échéance ${fmtDateFull(f.echeance)}, statut ${FACT_LABEL[factStatut(f)][0]}. Détail : ${f.lignes.map(x => x.libelle + ' ' + x.qte + ' × ' + x.pu + ' €').join(' ; ')}. Si la facture est en retard, rappelle-le avec tact. Indique que la facture est jointe en PDF. Signe « Bien cordialement, ${profileName()} » puis « BPN – Votre bien, notre engagement ». Réponds uniquement en JSON : {"objet": "...", "message": "..."}.` };
  }
  if (s.mode === 'incident') {
    const i = S.incidents[s.id]; if (!i) return null; const l = S.logements[i.logementId]; const o = S.contacts[l?.proprietaireId];
    return { to: o?.email, toName: fullName(o), subject: (l?.nom || 'Votre logement') + ' : intervention du ' + fmtDateFull(i.date),
      body: `Bonjour ${o?.prenom || ''},\n\nNous vous informons que nous avons constaté le problème suivant à ${l?.nom || 'votre logement'} le ${fmtDateFull(i.date)} : ${i.texte.charAt(0).toLowerCase() + i.texte.slice(1)}\n\n${i.statut === 'clos' ? 'Le problème est résolu.' : 'Nous nous en occupons et vous tenons informé(e) dès que c’est réglé.'}` + sign,

function guard() { if (readOnly) { toast('Lecture seule : modification impossible.'); return false; } return true; }
function moveStage(id, etape) {
  const c = S.contacts[id]; if (!c || c.etape === etape || !guard()) return;
  if (etape === 'signe' && !list('logements').some(l => l.proprietaireId === id)) { openSheet('sign', { id }); return; }
  if (etape === 'perdu') { openSheet('contact', { id, lost: true }); return; }
  const from = etapeNom(c.etape);

function consumeStock(lnom) {
  list('stocks').filter(s => (s.parRotation || 0) > 0).forEach(s => edit('stocks', s.id, o => {
    o.quantite = Math.max(0, r2((o.quantite || 0) - o.parRotation));

async function askAI(question) {
  if (!SAMPLE || CHAT.busy || !question.trim()) return;
  CHAT.err = ''; CHAT.turns.push({ role: 'user', content: question.trim() }); CHAT.busy = true; CHAT.ctl = new AbortController();
  render();
  const rules = 'Tu es l’assistant de gestion de BPN, conciergerie de locations saisonnières sur la côte sud du Morbihan. Réponds en français, de façon concise (5 phrases maximum ou une courte liste à tirets), uniquement à partir des données ci-dessous. Si une information manque, dis-le simplement. Pas de titres ni de gras. Données de l’appli :\n\n' + dataContext();
  try {
    const { text } = await SAMPLE([{ role: 'user', content: rules }].concat(CHAT.turns.slice(-8)), { cache: false, signal: CHAT.ctl.signal, onText: ({ text }) => { const el = $('#chat-live'); if (el) { el.textContent = text; el.classList.remove('wait'); } } });
    CHAT.turns.push({ role: 'assistant', content: text });
  } catch (e) {
    const msg = sampleErr(e);
    if (e && e.text) CHAT.turns.push({ role: 'assistant', content: e.text + ' […]' });
    CHAT.err = msg;
  }
  CHAT.busy = false; CHAT.ctl = null; render();
  const inpEl = $('#chat-input'); if (inpEl) inpEl.focus();
}

    if (UI.sheet && UI.sheet.id === id) renderSheet();
  },
  zone: el => { if (!guard()) return; const z = el.dataset.z; edit('concierges', el.dataset.id, c => { c.zone = (c.zone || []).filter(x => x !== z); if (el.checked) c.zone.push(z); }); },
  concPaid: el => { if (!guard()) return; edit('concierges', el.dataset.id, c => { c.paiements = c.paiements || {}; c.paiements[el.dataset.ym] = el.checked; }); },
  profile: el => { UI.profile = el.value; setPref('profile', el.value); if (UI.sheet && UI.sheet.kind === 'menu') closeSheet(); location.hash = isConcierge() ? 'missions' : isOwner() ? 'proprio' : 'accueil'; render(); }
};
const SUBMIT = {
  newContact: (f, fd) => {
    if (!guard()) return;
    const c = { id: uid('pr-'), type: 'prospect', prenom: fd.get('prenom').trim(), nom: fd.get('nom').trim(), tel: fd.get('tel'), email: fd.get('email'), commune: fd.get('commune'), origine: fd.get('origine'), prescripteur: (fd.get('prescripteur') || '').trim(), bien: fd.get('bien'), etape: S.settings.etapes[0].id, relance: fd.get('relance'), consentementEmail: !!fd.get('consentementEmail'), bloctel: false, notes: '', perduRaison: '', historique: [{ date: TODAY(), type: 'note', texte: 'Fiche créée', auteur: profileName() }], createdAt: TODAY() };
    put('contacts', c); openSheet('contact', { id: c.id }); toast('Prospect créé');
  },
  addHist: (f, fd) => { if (!guard()) return; const id = f.dataset.id; edit('contacts', id, c => { c.historique = c.historique || []; c.historique.push({ date: fd.get('date') || TODAY(), type: fd.get('type'), texte: fd.get('texte').trim(), auteur: profileName() }); }); renderSheet(); toast('Échange ajouté'); },
  lost: (f, fd) => { if (!guard()) return; const id = f.dataset.id; const r = fd.get('raison'); edit('contacts', id, c => { c.etape = 'perdu'; c.perduRaison = r; c.relance = ''; c.historique = c.historique || []; c.historique.push({ date: TODAY(), type: 'note', texte: 'Classé perdu : ' + r, auteur: profileName() }); }); UI.sheet.lost = false; renderSheet(); toast('Contact classé perdu'); },
  sign: (f, fd) => {
    if (!guard()) return;
    const pid = f.dataset.id || fd.get('proprietaireId');
    const fo = S.settings.formules.find(x => x.id === fd.get('formuleId')) || S.settings.formules[0];
    const l = { id: uid('l-'), nom: fd.get('nom').trim(), adresse: fd.get('adresse'), commune: fd.get('commune'), type: fd.get('type'), capacite: Number(fd.get('capacite')) || 0, proprietaireId: pid, contrat: { formuleId: fo.id, debut: fd.get('debut') || TODAY(), statut: 'actif', avenants: [] }, acces: { code: '', wifi: '' }, consignes: '', checklist: DEFAULT_CHECKLIST.slice(), conformite: { enregistrement: '', dpe: '', classement: '', assurance: '' }, createdAt: TODAY() };
    put('logements', l);
    edit('contacts', pid, c => { c.type = 'client'; c.etape = 'signe'; c.relance = ''; c.historique = c.historique || []; c.historique.push({ date: TODAY(), type: 'note', texte: 'Contrat signé : ' + l.nom + ', formule ' + fo.nom + ' (' + eur0(fo.prix) + ' HT/mois)', auteur: profileName() }); });
    openSheet('logement', { id: l.id }); toast('Contrat signé, logement créé');
  },
  addCheck: (f, fd) => { if (!guard()) return; const t = fd.get('t').trim(); if (!t) return; edit('logements', f.dataset.id, l => { l.checklist = l.checklist || []; l.checklist.push(t); }); renderSheet(); },
  newMission: (f, fd) => {
    if (!guard()) return;
    const l = S.logements[fd.get('logementId')]; if (!l) return;
    const ty = fd.get('type'); const svc = ty.startsWith('service:') ? S.settings.services.find(s => 'service:' + s.id === ty) : null;
    let cid = fd.get('conciergeId'); if (cid === 'auto') cid = suggestConcierge(l)?.id || '';
    const m = { id: uid('m-'), logementId: l.id, date: fd.get('date'), heure: fd.get('heure') || '11:00', type: svc ? 'service' : 'rotation', libelle: svc ? svc.nom : '', prix: svc ? svc.prix : 0, conciergeId: cid, statut: 'a_faire', faits: [], photos: { avant: 0, apres: 0 }, source: 'manuel', doneAt: '' };
    put('missions', m); UI.weekStart = mondayOf(m.date); closeSheet(); toast('Mission créée' + (cid ? ' pour ' + fullName(S.concierges[cid]) : ', à attribuer'));
  },
  ical: async (f, fd) => {
    if (!guard()) return;
    const l = S.logements[fd.get('logementId')]; if (!l) return;
    let txt = fd.get('txt') || ''; const file = fd.get('file'); if (file && file.size) { try { txt = await file.text(); } catch (e) { /* lecture impossible */ } }
    const evs = txt.replace(/\r\n[ \t]/g, '').split('BEGIN:VEVENT').slice(1);
    let created = 0, dup = 0, blocked = 0, past = 0; const t = TODAY(); const cid = suggestConcierge(l)?.id || '';
    evs.forEach(ev => {
      const sum = (/SUMMARY[^:]*:(.*)/.exec(ev) || [])[1] || ''; const end = (/DTEND[^:]*:(\d{8})/.exec(ev) || [])[1]; if (!end) return;
      if (/not available|blocked|closed|indisponible/i.test(sum)) { blocked++; return; }
      const d = end.slice(0, 4) + '-' + end.slice(4, 6) + '-' + end.slice(6, 8);
      if (d < t) { past++; return; }
      if (list('missions').some(m => m.logementId === l.id && m.type === 'rotation' && m.date === d)) { dup++; return; }
      put('missions', { id: uid('m-'), logementId: l.id, date: d, heure: '11:00', type: 'rotation', libelle: '', prix: 0, conciergeId: cid, statut: 'a_faire', faits: [], photos: { avant: 0, apres: 0 }, source: 'ical', doneAt: '' }); created++;
    });
    UI.sheet.result = evs.length ? `${plural(created, 'rotation créée', 'rotations créées')} pour ${l.nom}${dup ? ', ' + dup + ' déjà prévue' + (dup > 1 ? 's' : '') : ''}${blocked ? ', ' + plural(blocked, 'date bloquée ignorée', 'dates bloquées ignorées') : ''}${past ? ', ' + plural(past, 'date passée ignorée', 'dates passées ignorées') : ''}.` : 'Aucune réservation trouvée dans ce calendrier.';
    renderSheet();
  },
  problem: (f, fd) => { if (!guard()) return; const m = S.missions[f.dataset.id]; put('incidents', { id: uid('i-'), logementId: m.logementId, missionId: m.id, date: TODAY(), niveau: fd.get('niveau'), texte: fd.get('texte').trim(), statut: 'ouvert', auteur: isConcierge() ? fullName(myConcierge()) : profileName() }); UI.sheet.problem = false; renderSheet(); toast('Problème signalé à l’équipe'); },
  newConcierge: (f, fd) => {
    if (!guard()) return;
    const c = { id: uid('c-'), prenom: fd.get('prenom').trim(), nom: fd.get('nom').trim(), tel: fd.get('tel'), email: '', zone: fd.getAll('zone'), siret: fd.get('siret'), tarif: { petit: Number(fd.get('petit')) || 0, grand: Number(fd.get('grand')) || 0 }, docs: { urssaf: fd.get('urssaf'), rcpro: fd.get('rcpro') }, paiements: {}, actif: true };
    put('concierges', c); openSheet('concierge', { id: c.id }); toast('Concierge ajouté');
  },
  newStock: (f, fd) => { if (!guard()) return; const s = { id: uid('st-'), nom: fd.get('nom').trim(), unite: fd.get('unite') || 'unités', quantite: Number(fd.get('quantite')) || 0, seuil: Number(fd.get('seuil')) || 0, parRotation: Number(fd.get('parRotation')) || 0, mouvements: [] }; put('stocks', s); closeSheet(); toast('Article ajouté'); },
  restock: (f, fd) => { if (!guard()) return; const q = Number(fd.get('q')) || 0; if (!q) return; edit('stocks', f.dataset.id, s => { s.quantite = r2((s.quantite || 0) + q); s.mouvements = (s.mouvements || []).concat([{ date: TODAY(), delta: q, motif: 'Réapprovisionnement' }]).slice(-15); }); renderSheet(); toast('Stock mis à jour'); },
  newFrais: (f, fd) => {
    if (!guard()) return; const km = f.dataset.type === 'km';
    const o = { id: uid('fr-'), date: fd.get('date'), associe: fd.get('associe'), type: km ? 'km' : 'depense', depart: km ? fd.get('depart').trim() : '', arrivee: km ? fd.get('arrivee').trim() : '', km: km ? (Number(fd.get('km')) || 0) * (fd.get('ar') ? 2 : 1) : 0, motif: km ? fd.get('motif').trim() + (fd.get('ar') ? ' (aller-retour)' : '') : '', libelle: km ? '' : fd.get('libelle').trim(), montant: km ? 0 : Number(fd.get('montant')) || 0, categorie: km ? '' : fd.get('categorie') };
    put('frais', o); UI.fraisMonth = o.date.slice(0, 7); closeSheet(); toast(km ? 'Trajet enregistré : ' + num1(o.km) + ' km' : 'Dépense enregistrée');
  },
  ask: (f, fd) => { const q = fd.get('q') || ''; askAI(q); }
};

/* ---------- Événements ---------- */
document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (!a) return; const fn = ACT[a.dataset.act]; if (!fn) return; if (a.tagName !== 'A') e.preventDefault(); fn(a, e); });
document.addEventListener('change', e => { const a = e.target.closest('[data-chg]'); if (!a) return; const fn = CHG[a.dataset.chg]; if (fn) fn(a, e); });
document.addEventListener('submit', e => { const f = e.target.closest('form[data-submit]'); if (!f) return; e.preventDefault(); const fn = SUBMIT[f.dataset.submit]; if (fn) fn(f, new FormData(f)); });
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.input;
  if (k === 'crmSearch') { UI.q = e.target.value; const box = $('#crm-list'); if (box) box.innerHTML = crmListHTML(); }
  else if (k === 'cmpSubject' && UI.sheet) UI.sheet.subject = e.target.value;
  else if (k === 'cmpBody' && UI.sheet) UI.sheet.body = e.target.value;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.sheet) closeSheet();
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'chat-input') { e.preventDefault(); const q = e.target.value; e.target.value = ''; askAI(q); }
});
document.addEventListener('dragstart', e => { const d = e.target.closest && e.target.closest('[data-drag]'); if (!d) return; e.dataTransfer.setData('text/plain', d.dataset.drag); e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragover', e => { const c = e.target.closest && e.target.closest('[data-drop]'); if (c) { e.preventDefault(); c.classList.add('drop-hover'); } });
document.addEventListener('dragleave', e => { const c = e.target.closest && e.target.closest('[data-drop]'); if (c && !c.contains(e.relatedTarget)) c.classList.remove('drop-hover'); });
document.addEventListener('drop', e => { const c = e.target.closest && e.target.closest('[data-drop]'); if (!c) return; e.preventDefault(); c.classList.remove('drop-hover'); moveStage(e.dataTransfer.getData('text/plain'), c.dataset.drop); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS.includes(h)) { UI.view = h; pageArmed = ''; render(); window.scrollTo(0, 0); } });

boot();

</script>
